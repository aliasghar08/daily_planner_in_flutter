# ============================================
# MEMORY & PERFORMANCE SETTINGS
# ============================================
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# ============================================
# ANDROID SETTINGS
# ============================================
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false

# ============================================
# NETWORK SETTINGS (helps with downloads)
# ============================================
systemProp.http.keepAlive=true
systemProp.http.maxConnections=10
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

# ============================================
# GRADLE OPTIMIZATIONS
# ============================================
org.gradle.configureondemand=true
org.gradle.warning.mode=summary