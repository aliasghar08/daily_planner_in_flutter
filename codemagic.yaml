workflows:
  ios-app-store:
    name: iOS App Store & TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: daily_planner
    integrations:
      app_store_connect: Codemagic_API_Key # Name of the API key saved in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.dailyplanner # Replace with your exact Bundle ID
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Set up code signing profiles
        script: xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
